# archimedes-backup · perfil REAL — Omarchy (laptop da Paula)
# Origem: pasta pma do SSD extra montado no Omarchy (10.0.0.218) — necessário SSH ativo no alvo
# Destino: servidor de arquivos (10.0.0.4) — usuário backup (chave do Bruno autorizada)

[geral]
plataforma = linux
nome = omarchy-paula

[origem]
tipo = ssh
ssh_origem = paula@10.0.0.218
caminho = /run/media/paula/BRUNO/pma
excluir = *.tmp, *.part, lost+found/, .Trash-*

[destino]
tipo = ssh
ssh_destino = backup@10.0.0.4
caminho = /srv/arquivos/backup/omarchy-paula/

[navegador]
ativo = true
# navegador_browser = auto   # opcional: auto | chrome | edge (default auto)