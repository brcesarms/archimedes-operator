# archimedes-backup · perfil de EXEMPLO — LINUX (rsync)
# O perfil é o "cadastro da máquina". Copie, ajuste e salve como <nome>.conf.
#
# Vagas: plataforma = linux | windows · nome = identificador único

[geral]
plataforma = linux
nome = nome-da-maquina

[origem]
# tipo = ssh  → executa o rsync NA máquina de origem (agent forwarding p/ destino)
# tipo = local → origem é esta própria máquina (controller)
tipo = ssh
ssh_origem = usuario@ip-da-origem
caminho = /caminho/da/origem/
# excluir = lista separada por vírgula (ex: *.tmp, cache/, Downloads/)

[destino]
# tipo = ssh → destino acessado via rsync over SSH (recomendado)
tipo = ssh
ssh_destino = backup@ip-do-servidor
caminho = /srv/arquivos/backup/<maquina>/

[navegador]
# Backup de favoritos + senhas (criptografadas) do navegador padrão (Chrome/Edge)
ativo = true
# navegador_browser = auto   # opcional: auto | chrome | edge (default auto)