# archimedes-backup · perfil de EXEMPLO — WINDOWS (robocopy)
# O script backup-robocopy.ps1 varre C:\Users\* (Desktop, Documents, Downloads, Pictures)
# de cada usuário e copia para o destino UNC informado.

[geral]
plataforma = windows
nome = cliente-exemplo

[destino]
# Destino UNC (SMB) do servidor de arquivos — o mesmo do robocopy
tipo = unc
unc = \\10.0.0.4\backup\cliente-exemplo

[navegador]
# Backup de favoritos + senhas (criptografadas) do navegador padrão (Chrome/Edge)
ativo = true
# navegador_browser = auto   # opcional: auto | chrome | edge (default auto)